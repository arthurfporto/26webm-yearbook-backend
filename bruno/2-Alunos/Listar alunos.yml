info:
  name: Listar alunos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/alunos"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("deve retornar um array", function() {
          expect(res.getBody()).to.be.an('array');
        });

        test("nenhum aluno deve conter senhaHash", function() {
          const alunos = res.getBody();
          alunos.forEach(aluno => {
            expect(aluno).to.not.have.property('senhaHash');
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
